<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>천일문 PFAL</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="memoryLock" class="memory-lock" aria-hidden="true">
    <div class="memory-card">
      <div class="memory-kicker">기억할 한 가지</div>
      <div id="memoryRule" class="memory-rule"></div>
      <div id="memoryRecall" class="memory-recall hidden"></div>
      <button id="memoryContinue" class="primary hidden">확인</button>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
