name: Static QA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check growth-v06.js
          node --check compare-v07.js
          node --check pacing-v08.js
          node --check supervisor-v082.js
          node --check cloud-v09.js
          node --check cloud-diagnostic-v091.js
          node --check repair-guides-v092.js
          node --check guided-repair-v092.js
          node --check multiunit-v093b.js
          node --check sw.js
      - name: Verify required files
        run: |
          test -f index.html
          test -f multiunit-v093b.css
          test -f data/catalog.json
          for n in $(seq -w 1 32); do test -f "data/unit${n}.json"; done
          test -f cloud-v09.css
      - name: Validate JSON catalogs and flows
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['data/catalog.json',...Array.from({length:32},(_,i)=>`data/unit${String(i+1).padStart(2,'0')}.json`)];
          for(const file of files) JSON.parse(fs.readFileSync(file,'utf8'));
          const catalog=JSON.parse(fs.readFileSync('data/catalog.json','utf8'));
          const units=catalog.chapters.flatMap(c=>c.units||[]);
          if(units.length!==32) throw new Error(`catalog unit count=${units.length}`);
          const unitNos=new Set(), globalIds=new Set();
          for(const unit of units){
            if(unitNos.has(Number(unit.unit))) throw new Error(`duplicate catalog unit ${unit.unit}`);
            unitNos.add(Number(unit.unit));
            const file=`data/${unit.file}`, data=JSON.parse(fs.readFileSync(file,'utf8'));
            if(Number(data.meta?.unit)!==Number(unit.unit)) throw new Error(`${file}: unit metadata mismatch`);
            const ids=new Set();
            for(const item of (data.items||[])){
              if(!item.id||!item.sentence||!item.prompt||!item.interaction) throw new Error(`${file}: incomplete item`);
              if(ids.has(item.id)||globalIds.has(item.id)) throw new Error(`${file}: duplicate item id ${item.id}`);
              ids.add(item.id);globalIds.add(item.id);
              if(item.interaction==='choice'&&(!Array.isArray(item.choices)||!item.choices.length||item.answer==null)) throw new Error(`${file}: bad choice ${item.id}`);
              if(item.interaction==='pairSpan'&&(!Array.isArray(item.answers)||item.answers.length!==2)) throw new Error(`${file}: bad pairSpan ${item.id}`);
              if((item.interaction==='span'||item.interaction==='text')&&item.answer==null) throw new Error(`${file}: missing answer ${item.id}`);
            }
            for(const id of (data.validationFlow||[]).filter(x=>x!=='REPORT')) if(!ids.has(id)) throw new Error(`${file}: missing flow item ${id}`);
          }
          console.log(`Catalog + Unit 01~32 JSON PASS · ${globalIds.size} items`);
          NODE
